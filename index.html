<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 디스코드 / SNS 링크 미리보기 -->
  <meta property="og:title" content="붕괴: 스타레일 뉴비 가이드북">
  <meta property="og:description" content="행동 게이지부터 유물 세팅까지, 뉴비를 위한 실전 가이드">
  <meta property="og:image" content="https://star-rail.github.io/starrail-guide/images/guides/image-666.png">
  <meta property="og:url" content="https://star-rail.github.io/starrail-guide/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="manifest" href="manifest.json">

  <title>붕괴: 스타레일 • 행시 가이드북</title>
  
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

    :root {
      --bg: #0b0e17;
      --panel: #151a28;
      --panel-2: #1e2435;
      --line: #2a3146;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #7dd3fc;
      --accent2: #a78bfa;
      --success: #34d399;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", system-ui, sans-serif;
      line-height: 1.7;
      font-size: 15.5px;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Header */
    header {
      background: rgba(21, 26, 40, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
    }

    .logo {
      font-weight: 900;
      font-size: 1.35rem;
      color: #fff;
    }

    .logo span {
      color: var(--accent);
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 60px 0 40px;
    }

    .hero h1 {
      font-size: 2.6rem;
      font-weight: 900;
      margin: 0 0 12px;
      letter-spacing: -0.04em;
    }

    .hero p {
      color: var(--muted);
      max-width: 520px;
      margin: 0 auto;
      font-size: 1.05rem;
    }

    /* Search */
    .search-box {
      max-width: 560px;
      margin: 30px auto 0;
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 15px 20px 15px 48px;
      font-size: 1rem;
      color: var(--text);
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 15px;
      color: var(--muted);
    }

    /* Categories */
    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 30px 0 40px;
    }

    .cat {
      padding: 8px 16px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s;
    }

    .cat.active, .cat:hover {
      background: var(--accent);
      color: #0b0e17;
      border-color: var(--accent);
    }

    /* Section */
    .section {
      margin-bottom: 60px;
    }

    .section-title {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 16px;
      padding-left: 4px;
    }

    /* Guide Grid */
    .guide-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .guide-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .guide-card:hover {
      transform: translateY(-4px);
      border-color: #3d455f;
    }

    .guide-card h3 {
      margin: 0 0 8px;
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
    }

    .guide-card p {
      color: var(--muted);
      font-size: 0.93rem;
      margin: 0;
      line-height: 1.55;
    }

    .guide-meta {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 0.75rem;
      padding: 3px 9px;
      border-radius: 6px;
      background: var(--panel-2);
      color: var(--accent);
      font-weight: 700;
    }

    /* Roadmap */
    .roadmap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 50px;
    }

    .roadmap h2 {
      margin-top: 0;
      font-size: 1.25rem;
    }

    .roadmap ul {
      padding-left: 20px;
      margin: 16px 0;
    }

    .roadmap li {
      margin-bottom: 8px;
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }

    .modal.open { display: flex; }

    .modal-box {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 16px;
      max-width: 720px;
      width: 100%;
      max-height: 85vh;
      overflow: auto;
    }

    .modal-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    .modal-close {
      font-size: 1.8rem;
      cursor: pointer;
      color: var(--muted);
      background: none;
      border: none;
    }

    .modal-body {
      padding: 22px;
      line-height: 1.75;
    }

    .modal-body img {
      max-width: 100%;
      border-radius: 8px;
      margin: 12px 0;
    }

    .footer {
      text-align: center;
      padding: 50px 20px 30px;
      color: #555c6e;
      font-size: 0.85rem;
    }

    @media (max-width: 640px) {
      .guide-grid {
        grid-template-columns: 1fr;
      }
    }
 /* === buildImage용 CSS (여기에 붙여넣기) === */
.modal-box.wide {
  max-width: 1080px;
  max-height: 92vh;
}

.modal-box.wide .modal-body {
  padding: 12px 16px 20px;
}

.build-image {
  width: 100%;
  border-radius: 10px;
  border: 1px solid #2a3146;
  display: block;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  margin-bottom: 16px;
}

.build-image-note {
  margin-top: 12px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: 14px;
  color: var(--muted);
}
/* === buildImage용 CSS 여기까지 === */

.desktop-btn {
  background: #1e2435;
  color: #7dd3fc;
  border: 1px solid #2a3146;
  padding: 8px 14px;
  border-radius: 8px;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.2s;
}

.desktop-btn:hover {
  background: #7dd3fc;
  color: #0b0e17;
  border-color: #7dd3fc;
}

</style>
</head>
<body>

<!-- 
============================================================
✏️ 가이드 추가 / 수정 방법 (초보자용)

1. 이 파일을 VS Code나 메모장으로 열기
2. Ctrl + F 로 검색:   const guides = [
3. 아래에 있는 guides 배열 안에서 새로운 가이드를 추가하거나 수정하세요.
4. 형식은 아래 예시처럼 맞춰서 추가하면 됩니다.

예시:
{
  id: 11,
  category: "파밍",
  title: "새로운 가이드 제목",
  desc: "간단한 설명",
  content: `상세 설명 HTML`
}

저장 후 index.html을 다시 열면 바로 반영됩니다.
============================================================
-->

<header>
  <div class="container">
    <div class="nav">
      <div class="logo">스타레일 <span>뉴비 가이드북</span></div>

      <!-- 여기 추가 -->
      <button id="add-to-desktop" class="desktop-btn">
        바탕화면에 추가
      </button>
    </div>
  </div>
</header>

<div class="container">

  <!-- Hero -->
  <div class="hero">
    <h1>처음 시작하는<br>행시를 위한 가이드</h1>
    <p>맵 파밍부터 행동 게이지, 비술, 팀 추천, 유물 세팅까지.<br>뉴비가 가장 헷갈려하는 것들만 정리했습니다.</p>
    
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="가이드 검색 (예: 행동게이지, 파밍, 은랑)" onkeyup="filterGuides()">
    </div>
  </div>

  <!-- Quick Roadmap -->
  <div class="roadmap">
    <h2>🗺️ 행시야</h2>
    <ul>
      <li><strong>1</strong>: 기본 시스템 이해 </li>
      <li><strong>2</strong>: 미안하다</li>
      <li><strong>3</strong>: 뺑이쳐라</li>
      <li><strong>4</strong>: 그만먹어라</li>
    </ul>
    <p style="color:var(--muted); font-size:0.9rem;">공식 PV까지 곁들여 먹으면 맛있음</p>
  </div>

  <!-- Categories -->
  <div class="categories" id="categories">
    <div class="cat active" data-cat="all" onclick="setCategory(this)">전체</div>
    <div class="cat" data-cat="기본" onclick="setCategory(this)">기본 시스템</div>
    <div class="cat" data-cat="파밍,진행" onclick="setCategory(this)">파밍 &amp; 진행</div>
    <div class="cat" data-cat="캐릭터" onclick="setCategory(this)">캐릭터 &amp; 팀</div>
    <div class="cat" data-cat="세팅" onclick="setCategory(this)">유물 / 광추 세팅</div>
    <div class="cat" data-cat="미디어" onclick="setCategory(this)">PV 보는순서</div>
  </div>

  <!-- Guides -->
  <div class="section">
    <div class="section-title">📚 가이드 목록</div>
    <div class="guide-grid" id="guideGrid"></div>
  </div>

</div>



<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="modalTitle"></h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="guides-data.js"></script>

<script>
// ==================== 렌더링 & 필터 (이 아래는 건드리지 마세요) ====================
let currentCategory = "all";

function renderGuides(list) {
  const grid = document.getElementById("guideGrid");
  grid.innerHTML = "";
  grid.style.display = "";
  grid.style.gridTemplateColumns = "";

  if (list.length === 0) {
    grid.innerHTML = `<p style="color:#666; text-align:center; padding:40px;">조건에 맞는 가이드가 없습니다.</p>`;
    return;
  }

  list.forEach(guide => {
    const card = document.createElement("div");
    card.className = "guide-card";
    card.innerHTML = `
      <div class="tag">${guide.category}</div>
      <h3>${guide.title}</h3>
      <p>${guide.desc}</p>
    `;
    if (guide.category === "미디어" && guide.youtubeId) {
      card.onclick = () => {
        window.open(`https://www.youtube.com/watch?v=${guide.youtubeId}`, '_blank');
      };
    } else {
      card.onclick = () => openModal(guide);
    }
    grid.appendChild(card);
  });
}

// ==================== 미디어 전용 그룹 렌더 (renderGuides와 완전히 분리) ====================
// 미디어 탭/카테고리에서 호출할 때 사용
// mediaGroup 필드(예: "1장", "PV", "단편 애니") 기준으로 묶어서 보여줌
function renderMediaGrouped(list) {
  const container = document.getElementById("guideGrid");
  container.innerHTML = "";
  container.style.display = "block";
  container.style.gridTemplateColumns = "none";

  const grouped = {};
  list.forEach(item => {
    const group = item.mediaGroup || "기타";
    if (!grouped[group]) grouped[group] = [];
    grouped[group].push(item);
  });

  // 표시 순서 (원하는 대로 수정 가능)
  const groupOrder = ["1장", "2장", "PV", "단편 애니", "만화", "기타"];
  const sortedKeys = Object.keys(grouped).sort((a, b) => {
    const ia = groupOrder.indexOf(a);
    const ib = groupOrder.indexOf(b);
    return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
  });

  const keysToRender = sortedKeys.length > 0 ? sortedKeys : Object.keys(grouped);

  keysToRender.forEach(groupName => {
    const header = document.createElement("div");
    header.style.cssText = "margin-top:26px; margin-bottom:9px; font-size:15.5px; font-weight:700; color:#cbd5e1; border-bottom:1px solid #2a3146; padding-bottom:4px;";
    header.textContent = `[${groupName}]`;
    container.appendChild(header);

    grouped[groupName].forEach(item => {
      const row = document.createElement("div");
      row.style.cssText = "display:flex; gap:13px; align-items:flex-start; background:#151a28; padding:9px 11px; border-radius:9px; margin-bottom:7px; border:1px solid #2a3146;";

      row.innerHTML = `
        <img src="https://img.youtube.com/vi/${item.youtubeId}/hqdefault.jpg"
             style="width:124px; height:70px; object-fit:cover; border-radius:5px; flex-shrink:0; border:1px solid #334155;">
        <div style="flex:1; min-width:0; padding-top:1px;">
          <div style="font-weight:600; font-size:14px; line-height:1.32; color:#e5e7eb;">${item.title}</div>
          <a href="https://www.youtube.com/watch?v=${item.youtubeId}" target="_blank"
             style="color:#7dd3fc; font-size:12.5px; margin-top:4px; display:inline-block; text-decoration:none; opacity:0.92;">
            ▶ 유튜브에서 보기
          </a>
        </div>
      `;
      container.appendChild(row);
    });
  });
}
  
function filterGuides() {
  const keyword = document.getElementById("search").value.toLowerCase().trim();
  
  let filtered = guides;

  if (currentCategory !== "all") {
  // 콤마로 구분된 카테고리를 배열로 변환
  const allowedCategories = currentCategory.split(',').map(c => c.trim());

  filtered = filtered.filter(g =>
    allowedCategories.includes(g.category)
  );
}

  if (keyword) {
    filtered = filtered.filter(g => 
      g.title.toLowerCase().includes(keyword) || 
      g.desc.toLowerCase().includes(keyword)
    );
  }

 if (currentCategory === "미디어") {
    renderMediaGrouped(filtered);
  } else {
    renderGuides(filtered);
  }
}

function setCategory(el) {
  document.querySelectorAll(".cat").forEach(c => c.classList.remove("active"));
  el.classList.add("active");

  currentCategory = el.dataset.cat;
  filterGuides();
}

function openModal(guide) {
  document.getElementById("modalTitle").innerText = guide.title;
  const body = document.getElementById("modalBody");
  const modalBox = document.querySelector(".modal-box");

  if (guide.buildImage) {
    // 이미지 가이드 모드 (와이드 모달)
    modalBox.classList.add("wide");

    let html = `<img src="${guide.buildImage}" alt="${guide.title}" class="build-image">`;

    if (guide.content) {
      html += `<div class="build-image-note">${guide.content}</div>`;
    }

    body.innerHTML = html;
  } else {
    // 일반 가이드 모드
    modalBox.classList.remove("wide");
    body.innerHTML = guide.content || `<p>아직 작성 중인 가이드입니다.</p>`;
  }

  document.getElementById("modal").classList.add("open");
}

function closeModal() {
  const modalBox = document.querySelector(".modal-box");
  modalBox.classList.remove("wide");
  document.getElementById("modal").classList.remove("open");
}

// 초기화
function init() {
  renderGuides(guides);

  // 카테고리 클릭 시 전체 보기
  document.getElementById("categories").addEventListener("click", (e) => {
    if (e.target.classList.contains("cat")) {
      // 이미 setCategory에서 처리됨
    }
  });

  // ESC로 모달 닫기
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      const modal = document.getElementById("modal");
      if (modal.classList.contains("open")) closeModal();
    }
  });

  console.log("%c[스타레일 뉴비 가이드북] 초기화 완료", "color:#7dd3fc");
}
// 바탕화면 추가 버튼 (PWA 설치 프롬프트)
let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
});

document.getElementById('add-to-desktop').addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    console.log(`사용자 선택: ${outcome}`);
    deferredPrompt = null;
  } else {
    alert("이미 설치되었거나, 현재 브라우저에서는 설치가 지원되지 않습니다.\n주소창 오른쪽의 설치 아이콘을 이용해주세요.");
  }
});

init();
</script>
</body>
</html>
